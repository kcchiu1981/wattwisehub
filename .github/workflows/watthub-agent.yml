name: WattHub Content Agent

on:
  workflow_dispatch:
  schedule:
    - cron: "30 1 * * 1" # 每週一 01:30 UTC，台灣約 09:30

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-content:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install openai

      - name: Run WattHub Agent
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/watthub_agent.py

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Add WattHub AI draft"
          title: "WattHub Agent: new content draft"
          body: |
            This PR was generated by the WattHub Content Agent.
            Please review before publishing.
          branch: watthub-agent-draft
          delete-branch: true
